name: API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Image GHCR có sẵn để deploy lại hoặc rollback; để trống để build
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client và build API
        run: npx turbo run build --filter=api
      - name: Kiểm tra lint
        run: npx turbo run lint --filter=api
      - name: Kiểm tra kiểu dữ liệu
        run: npx turbo run check-types --filter=api
      - name: Chạy unit tests
        run: npx turbo run test --filter=api

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Chọn image
        id: image
        env:
          EXISTING_IMAGE: ${{ inputs.image }}
          IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$EXISTING_IMAGE" ]; then
            echo "image=$EXISTING_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.image == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.image == ''
      - name: Build Turbo và push image
        if: inputs.image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: api-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cấu hình SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          [[ $DEPLOY_PATH =~ ^/[a-zA-Z0-9_./-]+$ && $DEPLOY_PATH != / ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy-key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Tạo file env
        env:
          API_IMAGE: ${{ needs.build.outputs.image }}
          API_PORT: ${{ vars.API_PORT || '4000' }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_VOLUME: ${{ vars.POSTGRES_VOLUME }}
          POSTGRES_BIND_ADDRESS: ${{ vars.POSTGRES_BIND_ADDRESS || '127.0.0.1' }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
          JWT_ACCESS_TTL_SECONDS: ${{ vars.JWT_ACCESS_TTL_SECONDS }}
          JWT_REFRESH_TTL_SECONDS: ${{ vars.JWT_REFRESH_TTL_SECONDS }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          AUTH_COOKIE_SAME_SITE: ${{ vars.AUTH_COOKIE_SAME_SITE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          ZALO_ACCESS_TOKEN: ${{ secrets.ZALO_ACCESS_TOKEN }}
          ZALO_OTP_TEMPLATE_ID: ${{ vars.ZALO_OTP_TEMPLATE_ID }}
          ZALO_OTP_CODE_PARAM: ${{ vars.ZALO_OTP_CODE_PARAM }}
        run: |
          umask 077
          # Quote các giá trị nội suy Compose, kể cả mật khẩu chứa $ hoặc dấu nháy.
          jq -nr '{
            API_IMAGE: env.API_IMAGE, API_PORT: env.API_PORT,
            COMPOSE_PROJECT_NAME: env.COMPOSE_PROJECT_NAME,
            POSTGRES_USER: env.POSTGRES_USER, POSTGRES_PASSWORD: env.POSTGRES_PASSWORD,
            POSTGRES_DB: env.POSTGRES_DB, POSTGRES_VOLUME: env.POSTGRES_VOLUME,
            POSTGRES_BIND_ADDRESS: env.POSTGRES_BIND_ADDRESS, POSTGRES_PORT: env.POSTGRES_PORT
          } | to_entries[] | "\(.key)=\(.value | @json | gsub("\\$"; "\\$"))"' > .env
          for name in DATABASE_URL REDIS_URL JWT_SECRET OTP_HMAC_SECRET \
            JWT_ACCESS_TTL_SECONDS JWT_REFRESH_TTL_SECONDS CORS_ORIGINS LOG_LEVEL \
            AUTH_COOKIE_SAME_SITE RESEND_API_KEY RESEND_FROM_EMAIL \
            ZALO_ACCESS_TOKEN ZALO_OTP_TEMPLATE_ID ZALO_OTP_CODE_PARAM; do
            value=${!name}
            if [[ -n $value ]]; then
              [[ $value != *$'\n'* && $value != *$'\r'* ]]
              printf '%s=%s\n' "$name" "$value"
            fi
          done > .env.api

      - name: Gửi file lên server
        run: |
          ssh server "umask 077; mkdir -p '$DEPLOY_PATH'"
          scp apps/api/deploy/compose.yml .env .env.api "server:$DEPLOY_PATH/"
          ssh server "chmod 600 '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.env.api'"

      - name: Kiểm tra PostgreSQL
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          config=$(docker compose config --format json)
          postgresId=$(docker compose ps --all --quiet postgres)
          docker inspect "${postgresId:?PostgreSQL service not found}" | jq -e \
            --arg project "$(jq -r '.name' <<< "$config")" \
            --arg volume "$(jq -r '.volumes.postgres_data.name' <<< "$config")" '
            .[0] | .State.Health.Status == "healthy"
            and .Config.Labels["com.docker.compose.project"] == $project
            and any(.Mounts[]; .Type == "volume" and .Name == $volume)
          ' > /dev/null
          EOF

      - name: Migrate và khởi động API
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          docker compose pull api
          docker compose run --rm --no-deps -T migrate
          docker compose up -d --no-deps --wait --wait-timeout 180 api
          EOF

      - name: Xóa secrets tạm trên runner
        if: always()
        run: rm -f .env .env.api ~/.ssh/deploy-key
