name: API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Image GHCR có sẵn để deploy lại hoặc rollback; để trống để build
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Kiểm tra script deploy
        run: |
          bash -n apps/api/deploy/prepare-deployment.sh apps/api/deploy/deploy.sh
          shellcheck apps/api/deploy/prepare-deployment.sh apps/api/deploy/deploy.sh
      - name: Generate Prisma Client và build API
        run: npx turbo run build --filter=api
      - name: Kiểm tra lint
        run: npx turbo run lint --filter=api
      - name: Kiểm tra kiểu dữ liệu
        run: npx turbo run check-types --filter=api
      - name: Chạy unit tests
        run: npx turbo run test --filter=api

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Chọn image
        id: image
        env:
          EXISTING_IMAGE: ${{ inputs.image }}
          IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$EXISTING_IMAGE" ]; then
            echo "image=$EXISTING_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.image == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.image == ''
      - name: Build Turbo và push image
        if: inputs.image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Chuẩn bị cấu hình production
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          APP_COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          APP_API_IMAGE: ${{ needs.build.outputs.image }}
          APP_API_PORT: ${{ vars.API_PORT || '4000' }}
          APP_POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          APP_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          APP_POSTGRES_VOLUME: ${{ vars.POSTGRES_VOLUME }}
          APP_POSTGRES_BIND_ADDRESS: ${{ vars.POSTGRES_BIND_ADDRESS }}
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_REDIS_URL: ${{ secrets.REDIS_URL }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
          APP_JWT_ACCESS_TTL_SECONDS: ${{ vars.JWT_ACCESS_TTL_SECONDS }}
          APP_JWT_REFRESH_TTL_SECONDS: ${{ vars.JWT_REFRESH_TTL_SECONDS }}
          APP_CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          APP_LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          APP_AUTH_COOKIE_SAME_SITE: ${{ vars.AUTH_COOKIE_SAME_SITE }}
          APP_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          APP_ZALO_ACCESS_TOKEN: ${{ secrets.ZALO_ACCESS_TOKEN }}
          APP_ZALO_OTP_TEMPLATE_ID: ${{ vars.ZALO_OTP_TEMPLATE_ID }}
          APP_ZALO_OTP_CODE_PARAM: ${{ vars.ZALO_OTP_CODE_PARAM }}
        run: |
          bash apps/api/deploy/prepare-deployment.sh
          cp apps/api/deploy/compose.yml apps/api/deploy/deploy.sh deployment/
      - name: Gửi cấu hình và deploy bằng Docker Compose
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE || 'true' }}
        run: |
          set -eu
          case "$BACKUP_DATABASE" in true|false) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/deploy-key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$DEPLOY_PATH/incoming'"
          scp -i ~/.ssh/deploy-key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deployment/compose.yml deployment/deploy.sh deployment/.env deployment/.env.api \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/"
          ssh -i ~/.ssh/deploy-key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash '$DEPLOY_PATH/incoming/deploy.sh' '$DEPLOY_PATH' '$BACKUP_DATABASE'"
      - name: Xóa secrets tạm trên runner
        if: always()
        run: |
          rm -f deployment/.env deployment/.env.api ~/.ssh/deploy-key
