name: API and AI CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/ai/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["**"]
    paths:
      - "apps/api/**"
      - "apps/ai/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image:
        description: API image GHCR có sẵn để deploy lại hoặc rollback; để trống để build
        required: false
        type: string
      ai_image:
        description: AI image GHCR có sẵn để deploy lại hoặc rollback; để trống để build
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client và build API
        run: npx turbo run build --filter=api
      - name: Build AI service
        run: npm run build --workspace=ai
      - name: Kiểm tra kiểu dữ liệu
        run: npx turbo run check-types --filter=api

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.image.outputs.api_image }}
      ai_image: ${{ steps.image.outputs.ai_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Chọn image
        id: image
        env:
          EXISTING_API_IMAGE: ${{ inputs.image }}
          EXISTING_AI_IMAGE: ${{ inputs.ai_image }}
          IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$EXISTING_API_IMAGE" ]; then
            echo "api_image=$EXISTING_API_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "api_image=ghcr.io/${GITHUB_REPOSITORY,,}/api:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$EXISTING_AI_IMAGE" ]; then
            echo "ai_image=$EXISTING_AI_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "ai_image=ghcr.io/${GITHUB_REPOSITORY,,}/ai:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.image == '' || inputs.ai_image == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.image == '' || inputs.ai_image == ''
      - name: Build và push API image
        if: inputs.image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.api_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build và push AI image
        if: inputs.ai_image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ai_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: api-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cấu hình SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          [[ $DEPLOY_PATH =~ ^/[a-zA-Z0-9_./-]+$ && $DEPLOY_PATH != / ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy-key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Tạo file env
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          AI_IMAGE: ${{ needs.build.outputs.ai_image }}
          API_PORT: ${{ vars.API_PORT || '4000' }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_VOLUME: ${{ vars.POSTGRES_VOLUME }}
          POSTGRES_BIND_ADDRESS: ${{ vars.POSTGRES_BIND_ADDRESS || '127.0.0.1' }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
          JWT_ACCESS_TTL_SECONDS: ${{ vars.JWT_ACCESS_TTL_SECONDS }}
          JWT_REFRESH_TTL_SECONDS: ${{ vars.JWT_REFRESH_TTL_SECONDS }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          AUTH_COOKIE_SAME_SITE: ${{ vars.AUTH_COOKIE_SAME_SITE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          ZALO_ACCESS_TOKEN: ${{ secrets.ZALO_ACCESS_TOKEN }}
          ZALO_OTP_TEMPLATE_ID: ${{ vars.ZALO_OTP_TEMPLATE_ID }}
          ZALO_OTP_CODE_PARAM: ${{ vars.ZALO_OTP_CODE_PARAM }}
          AI_INTERNAL_TOKEN: ${{ secrets.AI_INTERNAL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          AI_SERVICE_URL: http://ai:4100
        run: |
          umask 077
          [[ -n $AI_INTERNAL_TOKEN && ${#AI_INTERNAL_TOKEN} -ge 32 ]]
          [[ -n $GEMINI_API_KEY ]]
          [[ $AI_INTERNAL_TOKEN != *$'\n'* && $AI_INTERNAL_TOKEN != *$'\r'* ]]
          [[ $GEMINI_API_KEY != *$'\n'* && $GEMINI_API_KEY != *$'\r'* ]]
          [[ $GEMINI_MODEL != *$'\n'* && $GEMINI_MODEL != *$'\r'* ]]
          # Quote các giá trị nội suy Compose, kể cả mật khẩu chứa $ hoặc dấu nháy.
          jq -nr '{
            API_IMAGE: env.API_IMAGE, AI_IMAGE: env.AI_IMAGE, API_PORT: env.API_PORT,
            COMPOSE_PROJECT_NAME: env.COMPOSE_PROJECT_NAME,
            POSTGRES_USER: env.POSTGRES_USER, POSTGRES_PASSWORD: env.POSTGRES_PASSWORD,
            POSTGRES_DB: env.POSTGRES_DB, POSTGRES_VOLUME: env.POSTGRES_VOLUME,
            POSTGRES_BIND_ADDRESS: env.POSTGRES_BIND_ADDRESS, POSTGRES_PORT: env.POSTGRES_PORT
          } | to_entries[] | "\(.key)=\(.value | @json | gsub("\\$"; "\\$"))"' > .env
          for name in DATABASE_URL REDIS_URL JWT_SECRET OTP_HMAC_SECRET \
            JWT_ACCESS_TTL_SECONDS JWT_REFRESH_TTL_SECONDS CORS_ORIGINS LOG_LEVEL \
            AUTH_COOKIE_SAME_SITE RESEND_API_KEY RESEND_FROM_EMAIL \
            ZALO_ACCESS_TOKEN ZALO_OTP_TEMPLATE_ID ZALO_OTP_CODE_PARAM \
            AI_SERVICE_URL AI_INTERNAL_TOKEN; do
            value=${!name}
            if [[ -n $value ]]; then
              [[ $value != *$'\n'* && $value != *$'\r'* ]]
              printf '%s=%s\n' "$name" "$value"
            fi
          done > .env.api
          {
            for name in GEMINI_API_KEY AI_INTERNAL_TOKEN GEMINI_MODEL; do
              value=${!name}
              [[ $value != *$'\n'* && $value != *$'\r'* ]]
              printf '%s=%s\n' "$name" "$value"
            done
            printf '%s\n' \
              'EMBEDDING_MODEL=Xenova/paraphrase-multilingual-MiniLM-L12-v2' \
              'ALLOW_MODEL_DOWNLOAD=false' \
              'RAG_MIN_SCORE=0.3'
          } > .env.ai

      - name: Gửi file lên server
        run: |
          ssh server "umask 077; mkdir -p '$DEPLOY_PATH'"
          scp apps/api/deploy/compose.yml .env .env.api .env.ai "server:$DEPLOY_PATH/"
          ssh server "chmod 600 '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.env.api' '$DEPLOY_PATH/.env.ai'"

      - name: Kiểm tra PostgreSQL
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          config=$(docker compose config --format json)
          postgresId=$(docker compose ps --all --quiet postgres)
          docker inspect "${postgresId:?PostgreSQL service not found}" | jq -e \
            --arg project "$(jq -r '.name' <<< "$config")" \
            --arg volume "$(jq -r '.volumes.postgres_data.name' <<< "$config")" '
            .[0] | .State.Health.Status == "healthy"
            and .Config.Labels["com.docker.compose.project"] == $project
            and any(.Mounts[]; .Type == "volume" and .Name == $volume)
          ' > /dev/null
          EOF

      - name: Migrate và khởi động API, AI
        id: startServices
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          docker compose pull api ai
          # SSH truyền script qua stdin; migration không được đọc các lệnh phía sau.
          docker compose run --rm --no-deps -T --interactive=false migrate < /dev/null
          docker compose up -d --no-deps --wait --wait-timeout 300 ai
          docker compose up -d --no-deps --wait --wait-timeout 180 api
          EOF

      - name: Lấy log khi khởi động API hoặc AI thất bại
        if: failure() && steps.startServices.outcome == 'failure'
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          docker compose ps --all api ai || true
          docker compose logs --no-color --tail=150 api ai || true
          for service in api ai; do
            containerId=$(docker compose ps --all --quiet "$service") || continue
            if [[ -n $containerId ]]; then
              printf '\n%s container state and healthcheck:\n' "$service"
              docker inspect --format '{{json .State}}' "$containerId" | jq . || true
            fi
          done
          EOF

      - name: Xác nhận container dùng image đã deploy
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'EOF'
          set -euo pipefail
          cd "$1"
          config=$(docker compose config --format json)
          for service in ai api; do
            expectedImage=$(jq -er --arg service "$service" '.services[$service].image' <<< "$config")
            expectedId=$(docker image inspect --format '{{.Id}}' "$expectedImage")
            containerId=$(docker compose ps --all --quiet "$service")
            docker inspect "${containerId:?Service container not found}" | jq -e \
              --arg image "$expectedImage" --arg imageId "$expectedId" '
              .[0] | .Config.Image == $image and .Image == $imageId
              and .State.Running == true and .State.Health.Status == "healthy"
            ' > /dev/null
            printf '%s is healthy: %s (%s)\n' "$service" "$expectedImage" "$expectedId"
          done
          EOF

      - name: Xóa secrets tạm trên runner
        if: always()
        run: rm -f .env .env.api .env.ai ~/.ssh/deploy-key
