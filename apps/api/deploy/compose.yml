name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    container_name: mediconnect-api
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.api
        format: raw
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health-check').then(async r => { if (!r.ok || !(await r.json()).success) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${AI_IMAGE:?Set AI_IMAGE}
    container_name: mediconnect-ai
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.ai
        format: raw
    environment:
      NODE_ENV: production
      PORT: "4100"
      HOST: 0.0.0.0
      MEDICONNECT_API_URL: http://api:4000/api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${API_IMAGE:?Set API_IMAGE}
    profiles: [tools]
    env_file:
      - path: .env.api
        format: raw
    command: ["npm", "run", "prisma:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: ${API_IMAGE:?Set API_IMAGE}
    profiles: [tools]
    env_file:
      - path: .env.api
        format: raw
    command: ["node", "dist-seed/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Set the existing PostgreSQL volume name}
